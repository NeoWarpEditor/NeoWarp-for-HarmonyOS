<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      [splash-theme="dark"]:not(.tw-loaded) {
        background-color: #222222;
      }
    </style>
      <script src="../assets/nw-core.js"></script>
    <script src="../assets/shims/misc.js"></script>
      <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'">
    <meta name="neowarp-offline" content="harmonyos-api26">
    <script src="../assets/harmony-bridge.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        let theme = localStorage.getItem('tw:theme');
        if (theme === null) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.body.setAttribute('splash-theme', theme);
      })();
    </script>
    <script>
      function webpackScriptError(event) {
        alert(`Error loading webpack script: ${event.target.src}`);
      }
    </script>
    <script src="index.js" onerror="webpackScriptError(event)"></script>
  </body>
</html>
